[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frontier-harness-eval"
version = "0.1.0"
description = "FrontierHarness Eval: 30 tasks (21 Terminal-Bench + 9 DeepSWE) with Prime Agent on Kimi K3"
requires-python = ">=3.12"
dependencies = [
    "verifiers[harbor]>=0.3.1",
]
tags = ["multi-turn", "sandbox", "terminal-bench", "deep-swe", "v1"]

[tool.hatch.build.targets.wheel]
packages = ["frontier_harness_eval"]
