[workspace]
resolver = "2"
members = [
    "crates/pa-types",
    "crates/pa-ai",
    "crates/pa-agent",
    "crates/pa-core",
    "crates/pa-daemon",
    "crates/pa-tui",
    "crates/pa-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = { version = "0.1", features = ["attributes"] }
pa-types = { path = "crates/pa-types" }
thiserror = "2"
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
